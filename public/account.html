<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your account — Signal</title>
  <link rel="stylesheet" href="/css/theme-core.css">
  <link rel="stylesheet" href="/css/theme-signal.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/breathing-waves.css">
  <script src="/js/api.js" defer></script>
  <script src="/js/account.js" defer></script>
  <script src="/js/breathing-waves.js" defer></script>
</head>
<body>
  <header class="topbar">
    <span class="brand">
      <svg class="brand-glyph" aria-hidden="true"><use href="/illos/theme-illos.svg#postcard"/></svg>
      <span>Signal</span>
    </span>
    <span class="topbar-actions">
      <a class="btn btn-ghost btn-sm" href="/dashboard">All surveys</a>
      <button id="signout-btn" class="btn btn-ghost btn-sm" type="button">Sign out</button>
    </span>
  </header>

  <header class="header-band" data-breathing-waves data-wave-palette="signal" role="none">
    <canvas></canvas>
    <div class="header-content">
      <p class="eyebrow">Profile</p>
      <h1 class="header-title">Your account</h1>
    </div>
  </header>

  <main class="page page-narrow">

    <div class="card">
      <h2>Account details</h2>
      <dl class="detail-list">
        <div><dt>Login email</dt><dd id="acct-email" class="mono">—</dd></div>
        <div><dt>Email verified</dt><dd id="acct-verified">—</dd></div>
        <div><dt>Created</dt><dd id="acct-created">—</dd></div>
        <div><dt>Last sign-in</dt><dd id="acct-last">—</dd></div>
      </dl>
    </div>

    <div class="card">
      <h2>Change password</h2>
      <form id="password-form" novalidate>
        <label class="field" for="cp-current">
          <span>Current password</span>
          <input type="password" id="cp-current" autocomplete="current-password" required>
        </label>
        <label class="field" for="cp-new">
          <span>New password (at least 12 characters)</span>
          <input type="password" id="cp-new" autocomplete="new-password" required>
        </label>
        <label class="field" for="cp-confirm">
          <span>Confirm new password</span>
          <input type="password" id="cp-confirm" autocomplete="new-password" required>
        </label>
        <p id="password-message" class="notice hidden"></p>
        <button type="submit" id="password-btn" class="btn btn-primary">Update password</button>
      </form>
    </div>

    <div class="card">
      <h2>Change login email</h2>
      <p class="faint">
        This is the address you sign in with. Changing it needs your current
        password.
      </p>
      <form id="email-form" novalidate>
        <label class="field" for="ce-new">
          <span>New login email</span>
          <input type="email" id="ce-new" autocomplete="email" required>
        </label>
        <label class="field" for="ce-confirm">
          <span>Confirm new login email</span>
          <input type="email" id="ce-confirm" autocomplete="off" required>
        </label>
        <label class="field" for="ce-current">
          <span>Current password</span>
          <input type="password" id="ce-current" autocomplete="current-password" required>
        </label>
        <p id="email-message" class="notice hidden"></p>
        <button type="submit" id="email-btn" class="btn btn-primary">Update email</button>
      </form>
    </div>
  </main>
  <footer class="app-footer"><a href="/license">License</a></footer>
</body>
</html>
