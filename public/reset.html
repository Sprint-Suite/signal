<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a password — Signal</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/api.js" defer></script>
  <script src="/js/reset.js" defer></script>
</head>
<body>
  <main class="shell">
    <div class="card page-narrow">
      <p class="brand"><span class="brand-dot"></span>Signal</p>
      <h1>Choose a new password</h1>

      <form id="reset-form" novalidate>
        <label class="field" for="password">
          <span>New password (at least 12 characters)</span>
          <input type="password" id="password" autocomplete="new-password" required>
        </label>
        <label class="field" for="confirm">
          <span>Confirm password</span>
          <input type="password" id="confirm" autocomplete="new-password" required>
        </label>
        <p id="reset-message" class="notice hidden"></p>
        <button type="submit" id="reset-btn" class="btn btn-primary btn-block">
          Set password
        </button>
      </form>

      <p id="reset-done" class="faint hidden"><a href="/">Continue to sign in</a></p>
    </div>
  </main>
  <footer class="app-footer"><a href="/license">License</a></footer>
</body>
</html>
