<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Signal</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/api.js" defer></script>
  <script src="/js/login.js" defer></script>
</head>
<body>
  <main class="shell">
    <div class="card page-narrow">
      <p class="brand"><span class="brand-dot"></span>Signal</p>
      <h1>Sign in</h1>
      <p class="muted">Agile health check — admin access.</p>

      <form id="login-form" novalidate>
        <label class="field" for="email">
          <span>Email</span>
          <input type="email" id="email" autocomplete="username" required>
        </label>
        <label class="field" for="password">
          <span>Password</span>
          <input type="password" id="password" autocomplete="current-password" required>
        </label>
        <p id="login-error" class="notice notice-error hidden"></p>
        <button type="submit" id="login-btn" class="btn btn-primary btn-block">Sign in</button>
      </form>

      <p class="faint"><a href="/forgot">Forgot your password?</a></p>
    </div>
  </main>
  <footer class="app-footer"><a href="/license">License</a></footer>
</body>
</html>
