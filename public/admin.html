<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teams &amp; admins — Signal</title>
  <link rel="stylesheet" href="/css/theme-core.css">
  <link rel="stylesheet" href="/css/theme-signal.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/breathing-waves.css">
  <script src="/js/api.js" defer></script>
  <script src="/js/admin.js" defer></script>
  <script src="/js/breathing-waves.js" defer></script>
</head>
<body>
  <header class="topbar">
    <span class="brand">
      <svg class="brand-glyph" aria-hidden="true"><use href="/illos/theme-illos.svg#postcard"/></svg>
      <span>Signal</span>
    </span>
    <span class="topbar-actions">
      <a class="btn btn-ghost btn-sm" href="/dashboard">All surveys</a>
      <a class="btn btn-ghost btn-sm" href="/account">Account</a>
      <button id="signout-btn" class="btn btn-ghost btn-sm" type="button">Sign out</button>
    </span>
  </header>

  <header class="header-band" data-breathing-waves data-wave-palette="signal" role="none">
    <canvas></canvas>
    <div class="header-content">
      <p class="eyebrow">Workspace</p>
      <h1 class="header-title">Teams &amp; admins</h1>
    </div>
  </header>

  <main class="page">

    <div class="card">
      <h2>Teams</h2>
      <p class="faint">
        A team is who a survey is for. Its access key is shown once on creation
        or rotation — copy it then.
      </p>

      <div class="row">
        <input type="text" id="team-name" placeholder="New team name" autocomplete="off">
        <button id="create-team-btn" class="btn btn-primary" type="button">Create team</button>
      </div>
      <p id="team-message" class="notice hidden"></p>
      <div id="key-reveal" class="hidden">
        <p class="faint" id="key-reveal-label"></p>
        <p id="key-reveal-value" class="key-box"></p>
      </div>

      <div id="team-list"></div>
    </div>

    <div class="card">
      <h2>Invite an admin</h2>
      <p class="faint">
        The invited person receives a link to set their password. Their account
        is created ready to use.
      </p>
      <div class="row">
        <input type="email" id="invite-email" placeholder="colleague@example.com" autocomplete="off">
        <button id="invite-btn" class="btn btn-primary" type="button">Send invite</button>
      </div>
      <p id="invite-message" class="notice hidden"></p>
    </div>
  </main>
  <footer class="app-footer"><a href="/license">License</a></footer>
</body>
</html>
