<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — Signal</title>
  <link rel="stylesheet" href="/css/theme-core.css">
  <link rel="stylesheet" href="/css/theme-signal.css">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/api.js" defer></script>
  <script src="/js/forgot.js" defer></script>
</head>
<body>
  <main class="shell">
    <div class="card page-narrow">
      <p class="brand">
        <svg class="brand-glyph" aria-hidden="true"><use href="/illos/theme-illos.svg#postcard"/></svg>
        <span>Signal</span>
      </p>
      <h1>Reset your password</h1>
      <p class="muted">
        Enter your account email. If it exists, we will send a reset link.
      </p>

      <form id="forgot-form" novalidate>
        <label class="field" for="email">
          <span>Email</span>
          <input type="email" id="email" autocomplete="username" required>
        </label>
        <p id="forgot-message" class="notice hidden"></p>
        <button type="submit" id="forgot-btn" class="btn btn-primary btn-block">
          Send reset link
        </button>
      </form>

      <p class="faint"><a href="/">Back to sign in</a></p>
    </div>
  </main>
  <footer class="app-footer"><a href="/license">License</a></footer>
</body>
</html>
