# Apache reverse proxy for Signal.
#
# Enable the required modules first:
#   sudo a2enmod proxy proxy_http headers
#
# Signal has no WebSockets, so a plain HTTP reverse proxy is sufficient.
# Apache terminates TLS and applies edge headers; the Node app binds 127.0.0.1.

<VirtualHost *:80>
    ServerName signal.example.com

    ProxyPreserveHost On
    ProxyRequests Off

    # mod_proxy_http adds X-Forwarded-For / X-Forwarded-Host automatically.
    # X-Forwarded-Proto is not, so set it explicitly — the app relies on it to
    # decide when to mark the session cookie Secure.
    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass        / http://127.0.0.1:3002/
    ProxyPassReverse / http://127.0.0.1:3002/

    # Survey submissions are small.
    LimitRequestBody 65536

    # Respondent paths carry invite codes; keep them out of the access log.
    SetEnvIfNoCase Request_URI "^/(s|api/respond)/" signal_respondent

    ErrorLog  ${APACHE_LOG_DIR}/signal-error.log
    CustomLog ${APACHE_LOG_DIR}/signal-access.log combined env=!signal_respondent
</VirtualHost>

# For production, redirect the vhost above to HTTPS and serve TLS here:
#
# <VirtualHost *:443>
#     ServerName signal.example.com
#
#     SSLEngine on
#     SSLCertificateFile    /etc/letsencrypt/live/signal.example.com/fullchain.pem
#     SSLCertificateKeyFile /etc/letsencrypt/live/signal.example.com/privkey.pem
#
#     ProxyPreserveHost On
#     ProxyRequests Off
#     RequestHeader set X-Forwarded-Proto "https"
#
#     ProxyPass        / http://127.0.0.1:3002/
#     ProxyPassReverse / http://127.0.0.1:3002/
#     LimitRequestBody 65536
#
#     SetEnvIfNoCase Request_URI "^/(s|api/respond)/" signal_respondent
#
#     ErrorLog  ${APACHE_LOG_DIR}/signal-error.log
#     CustomLog ${APACHE_LOG_DIR}/signal-access.log combined env=!signal_respondent
# </VirtualHost>
